  <circle cx="110" cy="50" r="9" fill="#F97316"/>
</g>
  <text x="152" y="74" font-family="'Inter Display', Inter, 'Segoe UI', sans-serif" font-weight="700" font-size="60" letter-spacing="-1.6" fill="#FFFFFF">Vefeyât</text>
  <text x="154" y="104" font-family="Inter, 'Segoe UI', sans-serif" font-weight="500" font-size="19" letter-spacing="0.1" fill="#7DD3FC">Biyografik referans yöneticisi</text>
