  <g><defs>
    <linearGradient id="ld-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#ld-bg)"/>
