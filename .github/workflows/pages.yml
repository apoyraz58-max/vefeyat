name: pages
# Publishes the add-in to GitHub Pages: main at the site root (development,
# every change at once), the beta branch under /beta/ (closed beta). Pages takes
# deployments from main only, so this always runs on main and builds the beta
# branch alongside. Promoting main to the beta:
#   git push origin main:beta && gh workflow run pages.yml --ref main
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build the beta branch into /beta/
        run: |
          if git rev-parse --verify --quiet origin/beta >/dev/null; then
            git worktree add ../beta-src origin/beta
            cd ../beta-src
            npm ci
            CHANNEL=beta BETA_NUMBER=$(git rev-list --count HEAD) \
              BASE_URL=https://apoyraz58-max.github.io/vefeyat/beta/ \
              OUT_DIR=$GITHUB_WORKSPACE/dist/addin/beta/ npm run build
          else
            echo "No beta branch yet."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/addin
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
